<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Test</title>
<style>
body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;font-family:sans-serif;color:#fff;}
video{width:80%;max-height:60vh;border:3px solid #f97316;}
p{margin:16px;font-size:1.1rem;text-align:center;}
a{color:#f97316;}
</style>
</head>
<body>
<p>Video Test Page - If video plays here it works</p>
<video id="v" controls autoplay muted playsinline loop
  src="https://res.cloudinary.com/wzaxevft/video/upload/v1788366782/shophere/yonxn9wcsy3dadnbdigi.mp4">
</video>
<p id="status">Loading...</p>
<button onclick="document.getElementById('v').muted=false;document.getElementById('v').play();" style="padding:12px 24px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin:8px;">Enable Sound + Play</button>
<script>
var v = document.getElementById('v');
var s = document.getElementById('status');
v.addEventListener('loadeddata', function(){ s.textContent='Video loaded OK! Duration: ' + v.duration.toFixed(1) + 's'; s.style.color='#4ade80'; });
v.addEventListener('playing', function(){ s.textContent='VIDEO IS PLAYING! '; s.style.color='#4ade80'; });
v.addEventListener('error', function(e){ s.textContent='VIDEO ERROR: ' + (v.error?v.error.message:'unknown'); s.style.color='red'; });
v.addEventListener('stalled', function(){ s.textContent='Video stalled...'; });
</script>
</body>
</html>
